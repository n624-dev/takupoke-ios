name: Test tools and catalogue

on:
  push:
    branches: [codex/pdf-local-recovery]
    paths:
      - .github/workflows/test-tools.yml
      - tools/*.py
      - tools/test-manual-ui.sh
      - tests/test_*.py
      - tests/test-catalog.json
      - tests/ui/ManualAssistance*.swift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    name: Catalogue and test-runner contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -B tools/test_catalog.py check
      - run: python3 -B -m unittest discover -s tests -v
      - run: bash -n tools/test-manual-ui.sh
      - run: git diff-tree --check HEAD
