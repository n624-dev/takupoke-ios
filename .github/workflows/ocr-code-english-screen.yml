name: Measure original ASCII code English recognition
on:
  push:
    branches: [codex/pdf-local-recovery]
    paths:
      - .github/workflows/ocr-code-english-screen.yml
      - tools/ocr-code-english-screen/**
      - tools/ocr-full-document-transfer/code_tail.py
      - tools/ocr-windows-transfer/**
      - tests/test_ocr_code_english_screen.py
permissions:
  contents: read
jobs:
  original-codes:
    name: Original code English SDK26
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify frozen application and compare original code pixels
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 861615662abc3d1f0f8ab5fc9b6ef992adc8ea37 "$GITHUB_SHA" -- \
            Takupoke Takupoke.xcodeproj Package.swift Package.resolved Vendor
          xcodebuild -version
          sw_vers
          bash tools/ocr-code-english-screen/run.sh
