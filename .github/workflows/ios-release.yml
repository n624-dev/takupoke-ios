name: iOS build and AltStore release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Build and test, or publish a previously verified development build
        type: choice
        options: [build, development-publish]
        default: build
      development_run_id:
        description: Completed development build run ID (publication only)
        type: string
        default: ''
      development_source:
        description: Full 40-character commit of that completed run (publication only)
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  checks:
    name: Distribution tests
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'development-publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check shared instruction bytes and strict task boundaries
        run: |
          python3 -B tools/recovery-prompt-contracts/check_shared_prompts.py
          python3 -B tools/recovery-prompt-contracts/test_shared_prompts.py
          python3 -B tools/recovery-prompt-contracts/check_ios_adapters.py
      - name: Check release and failure handling
        run: python3 -B -m unittest discover -s tests -v
      - name: Check shell syntax and whitespace
        run: |
          bash -n tools/build-ios.sh
          bash -n tools/build-ios-app.sh
          bash -n tools/test-materials.sh
          bash -n tools/test-parsing.sh
          bash -n tools/test-picker-ui.sh
          bash -n tools/test-app-ui.sh
          bash -n tools/test-manual-ui.sh
          bash -n tools/resolve-xcode-packages.sh
          git diff --check

  native-parsing:
    name: Native PDF and recovery tests
    needs: checks
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify actual PDFKit visibility and recovery contracts with fictional PDFs
        run: bash tools/test-parsing.sh

  simulator:
    name: Application iOS ${{ matrix.ios }} UI ${{ matrix.shard }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: 26
            shard: A
            runner: macos-26
            developer: /Applications/Xcode_26.6.app/Contents/Developer
            voiceover: '0'
          - ios: 26
            shard: B
            runner: macos-26
            developer: /Applications/Xcode_26.6.app/Contents/Developer
            voiceover: '0'
          - ios: 27
            shard: A
            runner: xcode-27
            developer: /Applications/Xcode_27.0.app/Contents/Developer
            voiceover: '1'
          - ios: 27
            shard: B
            runner: xcode-27
            developer: /Applications/Xcode_27.0.app/Contents/Developer
            voiceover: '1'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: ${{ matrix.developer }}
      TKPK_TEST_IOS: ${{ matrix.ios }}
      TKPK_UI_SHARD: ${{ matrix.shard }}
      TKPK_VOICEOVER_AUTOMATION: ${{ matrix.voiceover }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Exercise app screens with synthetic data
        run: |
          set -euo pipefail
          bash tools/test-app-ui.sh 2>&1 | tee "$RUNNER_TEMP/takupoke-app-ui-runner-owned.log"
          python3 -B tools/ui_test_manifest.py --shard "$TKPK_UI_SHARD" --mode verify --ios "$TKPK_TEST_IOS" --runner-log --log "$RUNNER_TEMP/takupoke-app-ui-runner-owned.log"
      - name: Remove the owned app runner log
        if: always()
        run: python3 -B -c 'import os; from pathlib import Path; (Path(os.environ["RUNNER_TEMP"])/"takupoke-app-ui-runner-owned.log").unlink(missing_ok=True)'

  manual:
    name: Manual correction iOS ${{ matrix.ios }} / ${{ matrix.case }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        ios: [26, 27]
        case:
          - testOneCorrectionRequiresUncheckedAcknowledgementAndSurvivesBackground
          - testChangedOriginalCannotSubmitOrReplaceLastGood
          - testThreeFieldsRequireEachAcknowledgementAndFourRefuses
        include:
          - ios: 26
            runner: macos-26
            developer: /Applications/Xcode_26.6.app/Contents/Developer
          - ios: 27
            runner: xcode-27
            developer: /Applications/Xcode_27.0.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: ${{ matrix.developer }}
      TKPK_TEST_IOS: ${{ matrix.ios }}
      TKPK_MANUAL_CASE: ${{ matrix.case }}
      TKPK_MANUAL_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact manual source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Exercise one manual case and require its exact completion
        run: bash tools/test-manual-ui.sh

  build-check:
    name: Check iPhone build outside development distribution
    needs: checks
    if: inputs.mode != 'development-publish' && (github.repository != 'n624-dev/takupoke-ios' || github.ref != 'refs/heads/main' || github.event_name == 'pull_request') && !(github.repository == 'n624-dev/takupoke-ios' && github.ref == 'refs/heads/codex/pdf-local-recovery' && github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Assign version and build number
        id: version
        run: python3 -B tools/release.py version --github-output "$GITHUB_OUTPUT"
      - name: Validate Xcode project and property lists
        run: plutil -lint Takupoke.xcodeproj/project.pbxproj Takupoke/Info.plist Takupoke/PrivacyInfo.xcprivacy
      - name: Build unsigned IPA and matching AltStore Source
        env:
          TKPK_VERSION: ${{ steps.version.outputs.version }}
          TKPK_BUILD: ${{ steps.version.outputs.build }}
          TKPK_COMMIT: ${{ github.sha }}
        run: bash tools/build-ios.sh "$RUNNER_TEMP/takupoke-output"
      - name: Remove build outputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/takupoke-output"

  development-build:
    name: Check iPhone build without publishing
    needs: checks
    if: github.repository == 'n624-dev/takupoke-ios' && github.ref == 'refs/heads/codex/pdf-local-recovery' && github.event_name == 'workflow_dispatch' && inputs.mode != 'development-publish'
    runs-on: xcode-27
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require exact development source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Assign version and build number
        id: version
        run: python3 -B tools/release.py version --github-output "$GITHUB_OUTPUT"
      - name: Validate Xcode project and property lists
        run: plutil -lint Takupoke.xcodeproj/project.pbxproj Takupoke/Info.plist Takupoke/PrivacyInfo.xcprivacy
      - name: Build unsigned IPA and matching AltStore Source locally
        env:
          TKPK_VERSION: ${{ steps.version.outputs.version }}
          TKPK_BUILD: ${{ steps.version.outputs.build }}
          TKPK_COMMIT: ${{ github.sha }}
        run: bash tools/build-ios.sh "$RUNNER_TEMP/takupoke-output"
      - name: Stage only a private owned development draft
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/development_release.py --stage "$RUNNER_TEMP/takupoke-output"
      - name: Remove only this owned private draft after build-job failure or cancellation
        if: ${{ (failure() || cancelled()) && steps.stage.outputs.draft_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TKPK_OWNED_DRAFT_ID: ${{ steps.stage.outputs.draft_id }}
        run: python3 -B tools/development_release.py --run-id "$GITHUB_RUN_ID" --commit "$GITHUB_SHA" --cleanup-draft "$TKPK_OWNED_DRAFT_ID"
      - name: Remove owned local build outputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/takupoke-output"

  release:
    name: Build and publish AltStore release
    needs: checks
    if: github.repository == 'n624-dev/takupoke-ios' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.mode != 'development-publish'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    permissions:
      contents: write
      actions: read
    concurrency:
      group: altstore-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Assign version and build number
        id: version
        run: python3 -B tools/release.py version --github-output "$GITHUB_OUTPUT"
      - name: Validate Xcode project and property lists
        run: plutil -lint Takupoke.xcodeproj/project.pbxproj Takupoke/Info.plist Takupoke/PrivacyInfo.xcprivacy
      - name: Build unsigned IPA and matching AltStore Source
        env:
          TKPK_VERSION: ${{ steps.version.outputs.version }}
          TKPK_BUILD: ${{ steps.version.outputs.build }}
          TKPK_COMMIT: ${{ github.sha }}
        run: bash tools/build-ios.sh "$RUNNER_TEMP/takupoke-output"
      - name: Require this run's simulator checks before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/release_gate.py
      - name: Verify uploads and publish together
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/publish.py --output "$RUNNER_TEMP/takupoke-output"
      - name: Remove build outputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/takupoke-output"

  development-publish:
    name: Publish previously verified development build
    if: github.repository == 'n624-dev/takupoke-ios' && github.ref == 'refs/heads/codex/pdf-local-recovery' && github.event_name == 'workflow_dispatch' && inputs.mode == 'development-publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: development-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Publish only the prior completed run's owned development draft
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TKPK_DEVELOPMENT_MODE: ${{ inputs.mode }}
          TKPK_DEVELOPMENT_RUN_ID: ${{ inputs.development_run_id }}
          TKPK_DEVELOPMENT_SOURCE: ${{ inputs.development_source }}
        run: python3 -B tools/development_publish_dispatch.py --output "$RUNNER_TEMP/takupoke-development-publish"
      - name: Remove only the recorded prior run's owned private draft on failure or cancellation
        if: ${{ (failure() || cancelled()) && steps.publish.outputs.draft_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TKPK_OWNED_DRAFT_ID: ${{ steps.publish.outputs.draft_id }}
          TKPK_QUALIFIED_RUN_ID: ${{ steps.publish.outputs.qualified_run_id }}
          TKPK_QUALIFIED_SOURCE: ${{ steps.publish.outputs.qualified_source }}
        run: python3 -B tools/development_release.py --run-id "$TKPK_QUALIFIED_RUN_ID" --commit "$TKPK_QUALIFIED_SOURCE" --cleanup-draft "$TKPK_OWNED_DRAFT_ID"
      - name: Remove owned local publication outputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/takupoke-development-publish"
