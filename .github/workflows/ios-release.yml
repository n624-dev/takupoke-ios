name: iOS build and AltStore release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  checks:
    name: Distribution tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check release and failure handling
        run: python3 -B -m unittest discover -s tests -v
      - name: Check shell syntax and whitespace
        run: |
          bash -n tools/build-ios.sh
          bash -n tools/build-ios-app.sh
          bash -n tools/test-materials.sh
          bash -n tools/test-parsing.sh
          bash -n tools/test-picker-ui.sh
          bash -n tools/test-app-ui.sh
          git diff --check

  simulator:
    name: Application iOS ${{ matrix.ios }} UI
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: 26
            runner: macos-26
            developer: /Applications/Xcode_26.6.app/Contents/Developer
            voiceover: '0'
          - ios: 27
            runner: xcode-27
            developer: /Applications/Xcode_27.0.app/Contents/Developer
            voiceover: '1'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: ${{ matrix.developer }}
      TKPK_TEST_IOS: ${{ matrix.ios }}
      TKPK_VOICEOVER_AUTOMATION: ${{ matrix.voiceover }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Exercise app screens with synthetic data
        run: bash tools/test-app-ui.sh

  build-check:
    name: Check iPhone build without publishing
    needs: checks
    if: github.repository != 'n624-dev/takupoke-ios' || github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Assign version and build number
        id: version
        run: python3 -B tools/release.py version --github-output "$GITHUB_OUTPUT"
      - name: Validate Xcode project and property lists
        run: plutil -lint Takupoke.xcodeproj/project.pbxproj Takupoke/Info.plist Takupoke/PrivacyInfo.xcprivacy
      - name: Build unsigned IPA and matching AltStore Source
        env:
          TKPK_VERSION: ${{ steps.version.outputs.version }}
          TKPK_BUILD: ${{ steps.version.outputs.build }}
          TKPK_COMMIT: ${{ github.sha }}
        run: bash tools/build-ios.sh "$RUNNER_TEMP/takupoke-output"
      - name: Remove build outputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/takupoke-output"

  release:
    name: Build and publish AltStore release
    needs: checks
    if: github.repository == 'n624-dev/takupoke-ios' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    permissions:
      contents: write
      actions: read
    concurrency:
      group: altstore-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Assign version and build number
        id: version
        run: python3 -B tools/release.py version --github-output "$GITHUB_OUTPUT"
      - name: Validate Xcode project and property lists
        run: plutil -lint Takupoke.xcodeproj/project.pbxproj Takupoke/Info.plist Takupoke/PrivacyInfo.xcprivacy
      - name: Build unsigned IPA and matching AltStore Source
        env:
          TKPK_VERSION: ${{ steps.version.outputs.version }}
          TKPK_BUILD: ${{ steps.version.outputs.build }}
          TKPK_COMMIT: ${{ github.sha }}
        run: bash tools/build-ios.sh "$RUNNER_TEMP/takupoke-output"
      - name: Require this run's simulator checks before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/release_gate.py
      - name: Verify uploads and publish together
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/publish.py --output "$RUNNER_TEMP/takupoke-output"
      - name: Remove build outputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/takupoke-output"
