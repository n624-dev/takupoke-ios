name: Read bounded fictional UI diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read only the pinned fictional UI run
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B tools/read_owned_ui_logs.py
