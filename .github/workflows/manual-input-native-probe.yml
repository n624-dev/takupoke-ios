name: Native manual input focus check

on:
  workflow_dispatch:
    inputs:
      case:
        type: choice
        default: testThreeFieldsRequireEachAcknowledgementAndFourRefuses
        options:
          - testThreeFieldsRequireEachAcknowledgementAndFourRefuses
          - testOneCorrectionRequiresUncheckedAcknowledgementAndSurvivesBackground
          - testChangedOriginalCannotSubmitOrReplaceLastGood
          - testSelectedHighConfidenceFieldsRetainInputsRejectFourthAndSurviveRelaunch

permissions:
  contents: read

jobs:
  focus:
    name: Native input iOS ${{ matrix.ios }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: 26
            runner: macos-26
            developer: /Applications/Xcode_26.6.app/Contents/Developer
          - ios: 27
            runner: xcode-27
            developer: /Applications/Xcode_27.0.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.case == 'testSelectedHighConfidenceFieldsRetainInputsRejectFourthAndSurviveRelaunch' && 45 || 35 }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer }}
      TKPK_TEST_IOS: ${{ matrix.ios }}
      TKPK_MANUAL_CASE: ${{ inputs.case || 'testThreeFieldsRequireEachAcknowledgementAndFourRefuses' }}
      TKPK_MANUAL_DIAGNOSTICS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare shipping iOS 27.0 for the focused comparison
        if: matrix.ios == 27
        run: python3 -B tools/prepare-ios27-runtime.py
      - name: Exercise physical replacement, independent acknowledgement and saved adoption
        run: bash tools/test-manual-ui.sh
