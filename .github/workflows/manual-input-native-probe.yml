name: Native manual input focus check

on:
  workflow_dispatch:
    inputs:
      case:
        type: choice
        default: testThreeFieldsRequireEachAcknowledgementAndFourRefuses
        options:
          - all
          - testThreeFieldsRequireEachAcknowledgementAndFourRefuses
          - testOneCorrectionRequiresUncheckedAcknowledgementAndSurvivesBackground
          - testChangedOriginalCannotSubmitOrReplaceLastGood
          - testSelectedHighConfidenceFieldsRetainInputsRejectFourthAndSurviveRelaunch
      sdk26:
        description: Xcode for iOS 26 (27.1 matches the shipping toolchain)
        type: choice
        default: '26.6'
        options: ['26.6', '27.1']

permissions:
  contents: read

jobs:
  focus:
    name: Native input iOS ${{ matrix.ios }} / ${{ matrix.case }}
    strategy:
      fail-fast: false
      matrix:
        ios: [26, 27]
        case: ${{ fromJSON(inputs.case == 'all' && '["testThreeFieldsRequireEachAcknowledgementAndFourRefuses","testOneCorrectionRequiresUncheckedAcknowledgementAndSurvivesBackground","testChangedOriginalCannotSubmitOrReplaceLastGood","testSelectedHighConfidenceFieldsRetainInputsRejectFourthAndSurviveRelaunch"]' || format('["{0}"]', inputs.case)) }}
        include:
          - ios: 26
            runner: ${{ inputs.sdk26 == '27.1' && 'xcode-27' || 'macos-26' }}
            developer: ${{ inputs.sdk26 == '27.1' && '/Applications/Xcode_27.1.app/Contents/Developer' || '/Applications/Xcode_26.6.app/Contents/Developer' }}
          - ios: 27
            runner: xcode-27
            developer: /Applications/Xcode_27.1.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.case == 'testSelectedHighConfidenceFieldsRetainInputsRejectFourthAndSurviveRelaunch' && 45 || 35 }}
    env:
      TKPK_EXPECTED_IOS_SDK: ${{ (matrix.ios == 27 || inputs.sdk26 == '27.1') && '27.1' || '26.5' }}
      DEVELOPER_DIR: ${{ matrix.developer }}
      TKPK_TEST_IOS: ${{ matrix.ios }}
      TKPK_MANUAL_CASE: ${{ matrix.case }}
      TKPK_MANUAL_DIAGNOSTICS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare shipping iOS 27.0 for the focused comparison
        if: matrix.ios == 27
        run: python3 -B tools/prepare-ios27-runtime.py
      - name: Prepare exact iOS 26.5 with the shipping SDK
        if: matrix.ios == 26 && inputs.sdk26 == '27.1'
        run: python3 -B tools/prepare-ios26-runtime.py --hold-export
      - name: Exercise physical replacement, independent acknowledgement and saved adoption
        run: bash tools/test-manual-ui.sh
      - name: Remove the owned iOS 26 runtime export after simulator cleanup
        if: always() && matrix.ios == 26 && inputs.sdk26 == '27.1'
        run: python3 -B tools/prepare-ios26-runtime.py --cleanup-export
