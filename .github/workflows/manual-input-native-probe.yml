name: Native manual input focus check

on:
  workflow_dispatch:
    inputs:
      case:
        type: choice
        default: testThreeFieldsRequireEachAcknowledgementAndFourRefuses
        options:
          - all
          - testThreeFieldsRequireEachAcknowledgementAndFourRefuses
          - testOneCorrectionRequiresUncheckedAcknowledgementAndSurvivesBackground
          - testChangedOriginalCannotSubmitOrReplaceLastGood
          - testSelectedHighConfidenceFieldsRetainInputsRejectFourthAndSurviveRelaunch
      sdk26:
        description: Xcode for iOS 26 (27.2 matches the shipping toolchain)
        type: choice
        default: '26.6'
        options: ['26.6', '27.1', '27.2']
      sdk27:
        description: Compare an installed toolchain on the unchanged iOS 27.0 runtime
        type: choice
        default: '27.1'
        options: ['27.1', '27.2']
      ios:
        description: Runtime major for the focused comparison
        type: choice
        default: both
        options: ['both', '26', '27']

permissions:
  contents: read

jobs:
  focus:
    name: Native input iOS ${{ matrix.ios }} / ${{ matrix.case }}
    strategy:
      fail-fast: false
      matrix:
        ios: ${{ fromJSON(inputs.ios == 'both' && '[26,27]' || inputs.ios == '26' && '[26]' || '[27]') }}
        case: ${{ fromJSON(inputs.case == 'all' && '["testThreeFieldsRequireEachAcknowledgementAndFourRefuses","testOneCorrectionRequiresUncheckedAcknowledgementAndSurvivesBackground","testChangedOriginalCannotSubmitOrReplaceLastGood","testSelectedHighConfidenceFieldsRetainInputsRejectFourthAndSurviveRelaunch"]' || format('["{0}"]', inputs.case)) }}
    runs-on: ${{ matrix.ios == 26 && inputs.sdk26 == '26.6' && 'macos-26' || 'xcode-27' }}
    timeout-minutes: ${{ matrix.case == 'testSelectedHighConfidenceFieldsRetainInputsRejectFourthAndSurviveRelaunch' && 45 || 35 }}
    env:
      TKPK_EXPECTED_IOS_SDK: ${{ matrix.ios == 27 && inputs.sdk27 || inputs.sdk26 != '26.6' && inputs.sdk26 || '26.5' }}
      DEVELOPER_DIR: ${{ format('/Applications/Xcode_{0}.app/Contents/Developer', matrix.ios == 27 && inputs.sdk27 || inputs.sdk26) }}
      TKPK_FOCUS_IOS: ${{ inputs.ios }}
      TKPK_FOCUS_SDK26: ${{ inputs.sdk26 }}
      TKPK_FOCUS_SDK27: ${{ inputs.sdk27 }}
      TKPK_SIMULATOR_FRONTEND: ${{ matrix.ios == 26 && 'gui' || 'headless' }}
      TKPK_MANUAL_RUNNER_SECONDS: ${{ matrix.case == 'testSelectedHighConfidenceFieldsRetainInputsRejectFourthAndSurviveRelaunch' && 2400 || 1800 }}
      TKPK_TEST_IOS: ${{ matrix.ios }}
      TKPK_MANUAL_CASE: ${{ matrix.case }}
      TKPK_MANUAL_DIAGNOSTICS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate focused OS and toolchain selection
        run: |
          case "$TKPK_FOCUS_IOS" in both|26|27) ;; *) exit 2 ;; esac
          case "$TKPK_FOCUS_SDK26" in 26.6|27.1|27.2) ;; *) exit 2 ;; esac
          case "$TKPK_FOCUS_SDK27" in 27.1|27.2) ;; *) exit 2 ;; esac
      - name: Exercise physical replacement, independent acknowledgement and saved adoption
        run: |
          python3 -B tools/timed_command.py --timeout "$TKPK_MANUAL_RUNNER_SECONDS" --cleanup-grace 120 "Focused manual preparation and UI runner" bash -euo pipefail -c '
            python3 -B tools/select-ci-xcode.py
            if [[ "$TKPK_TEST_IOS" == 27 ]]; then
              python3 -B tools/prepare-ios27-runtime.py
            elif [[ "$TKPK_TEST_IOS" == 26 && "$TKPK_FOCUS_SDK26" != 26.6 ]]; then
              python3 -B tools/prepare-ios26-runtime.py --hold-export
            fi
            bash tools/test-manual-ui.sh
          '
      - name: Remove the owned iOS 26 runtime export after simulator cleanup
        if: always() && matrix.ios == 26 && inputs.sdk26 != '26.6'
        run: python3 -B tools/prepare-ios26-runtime.py --cleanup-export
