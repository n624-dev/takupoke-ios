name: Verify bounded ordered-row recovery contracts
on:
  push:
    branches: [research/ios-ordered-row-proof-20261007]
permissions:
  contents: read
jobs:
  native:
    name: Native PDFKit and ordered-row regression
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare owned Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/ordered-row-python-owned"
          "$RUNNER_TEMP/ordered-row-python-owned/bin/python" -m pip install --no-cache-dir --disable-pip-version-check -r tools/independent-wide-timetable/requirements.txt
      - name: Generate independent temporary source PDFs
        run: '"$RUNNER_TEMP/ordered-row-python-owned/bin/python" -B tools/ordered-row-e2e/generate.py --output "$RUNNER_TEMP/ordered-row-e2e-owned"'
      - run: bash tools/test-parsing.sh
        env:
          TAKUPOKE_ORDERED_ROW_FIXTURES: ${{ runner.temp }}/ordered-row-e2e-owned
      - name: Remove all owned generated PDFs and fonts
        if: always()
        run: rm -rf "$RUNNER_TEMP/ordered-row-e2e-owned" "$RUNNER_TEMP/ordered-row-python-owned"
  build:
    name: iOS SDK build without publication
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: bash
        run: |
          set -euo pipefail
          task_dir="$(mktemp -d "${TMPDIR:-/tmp}/takupoke-ordered-build.XXXXXX")"
          trap 'rm -rf "$task_dir"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          xcodebuild -project Takupoke.xcodeproj -scheme Takupoke -configuration Debug -sdk iphonesimulator -derivedDataPath "$task_dir/build" -clonedSourcePackagesDirPath "$task_dir/packages" CODE_SIGNING_ALLOWED=NO build
