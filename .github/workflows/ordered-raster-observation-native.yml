name: Observe paired invented image PDFs with native Vision
on:
  push:
    branches: [research/ios-ordered-raster-observation-20261007]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-ordered-raster-observation
  cancel-in-progress: true
jobs:
  observe:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Measure independent native confidence by item and original position
        run: bash tools/test-parsing.sh
        env:
          TAKUPOKE_NATIVE_SCORE_BOUNDARY: '1'
