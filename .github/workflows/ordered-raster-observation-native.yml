name: Observe paired invented image PDFs with native Vision
on:
  push:
    branches: [research/ios-ordered-raster-observation-20261007]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-ordered-raster-observation
  cancel-in-progress: true
jobs:
  observe:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare owned Python and paired invented PDFs
        run: |
          python3 -m venv "$RUNNER_TEMP/ordered-raster-python-owned"
          "$RUNNER_TEMP/ordered-raster-python-owned/bin/python" -m pip install --no-cache-dir --disable-pip-version-check -r tools/independent-wide-timetable/requirements.txt
          "$RUNNER_TEMP/ordered-raster-python-owned/bin/python" -B tools/ordered-row-e2e/generate.py --output "$RUNNER_TEMP/ordered-raster-owned"
          "$RUNNER_TEMP/ordered-raster-python-owned/bin/python" -B tools/ordered-row-e2e/generate_raster.py --fixtures "$RUNNER_TEMP/ordered-raster-owned"
      - name: Run native whole-page observation without publication
        run: bash tools/test-parsing.sh
        env:
          TAKUPOKE_ORDERED_RASTER_FIXTURES: ${{ runner.temp }}/ordered-raster-owned
      - name: Remove all owned images and dependencies
        if: always()
        run: rm -rf "$RUNNER_TEMP/ordered-raster-owned" "$RUNNER_TEMP/ordered-raster-python-owned"
