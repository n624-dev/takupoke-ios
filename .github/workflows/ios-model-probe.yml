# Staged research-only workflow; not installed or dispatched. Root owns writes.
name: Build standalone iOS model probe
on:
  push:
    branches: ['research/ios-model-probe-*']
    paths: ['.github/workflows/ios-model-probe.yml', 'tools/phone-model-probe/ios-high-phone-benchmark-source.zip']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft prerelease tag for this isolated research artifact
        required: true
        type: string
      release_id:
        description: Immutable numeric ID of the exact existing draft research prerelease
        required: true
        type: string
      source_sha256:
        description: SHA256 of reviewed ios-high-phone-benchmark-source.zip
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: ios-model-probe-${{ github.event.inputs.release_tag || 'model-probe-ios-20261004' }}
  cancel-in-progress: false
jobs:
  research-build:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      QA_TAG: ${{ github.event.inputs.release_tag || 'model-probe-ios-20261004' }}
      QA_RELEASE_ID: ${{ github.event.inputs.release_id || '402903016' }}
      # Exact reviewed research source archive; feature branch only.
      QA_SOURCE_SHA256: ${{ github.event.inputs.source_sha256 || 'bcf9a930df495613187152f90acc44110ced12c7d7e4e63bef33dcf44e84f8cc' }}
    steps:
      - name: Checkout the immutable research source archive
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, same pinned action as production CI
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: tools/phone-model-probe/ios-high-phone-benchmark-source.zip
          sparse-checkout-cone-mode: false
      - name: Validate destination is a draft research prerelease
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QA_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$QA_TAG" =~ ^model-probe-ios-[0-9]{8}(-[a-z0-9]+)?$ ]]
          [[ "$QA_SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$QA_RELEASE_ID" > "$RUNNER_TEMP/qa-release.json"
          python3 - "$RUNNER_TEMP/qa-release.json" <<'PY'
          import json,os,sys
          value=json.load(open(sys.argv[1]))
          assert value['id']==int(os.environ['QA_RELEASE_ID']) and value['tag_name']==os.environ['QA_TAG'] and value['draft'] and value['prerelease'], 'Only exact immutable draft prerelease may receive QA artifacts'
          PY
      - name: Verify the committed reviewed standalone project
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/model-probe-input"
          cp "$GITHUB_WORKSPACE/tools/phone-model-probe/ios-high-phone-benchmark-source.zip" "$RUNNER_TEMP/model-probe-input/ios-high-phone-benchmark-source.zip"
          python3 - "$RUNNER_TEMP/model-probe-input/ios-high-phone-benchmark-source.zip" "$QA_SOURCE_SHA256" "$RUNNER_TEMP/model-probe-input" <<'PY'
          import hashlib,pathlib,sys,zipfile
          archive=pathlib.Path(sys.argv[1])
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==sys.argv[2]
          with zipfile.ZipFile(archive) as zipped:
              assert len(zipped.infolist())<=128
              assert sum(item.file_size for item in zipped.infolist())<=5_000_000
              for item in zipped.infolist():
                  parts=pathlib.PurePosixPath(item.filename).parts
                  assert parts and parts[0]=='ios-high-phone-benchmark'
                  assert not item.filename.startswith('/') and '..' not in parts
                  assert (item.external_attr>>16)&0o170000!=0o120000
              zipped.extractall(sys.argv[3])
          PY
      - name: Compile the standalone device app and actual Core AI runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/model-probe-input/ios-high-phone-benchmark"
          plutil -lint ModelProbe.xcodeproj/project.pbxproj Info.plist
          xcodebuild -version
          xcodebuild -project ModelProbe.xcodeproj -scheme ModelProbe -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/model-probe-build" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/model-probe-xcodebuild.log" 2>&1 || { tail -n 160 "$RUNNER_TEMP/model-probe-xcodebuild.log"; exit 1; }
          app="$RUNNER_TEMP/model-probe-build/Build/Products/Release-iphoneos/ModelProbe.app"
          python3 - "$app" <<'PY'
          import pathlib,plistlib,sys
          app=pathlib.Path(sys.argv[1]);info=plistlib.loads((app/'Info.plist').read_bytes())
          assert info['CFBundleIdentifier']=='jp.n624.takupoke-modelprobe'
          assert info['MinimumOSVersion']=='27.0'
          assert (app/'ModelProbe').is_file()
          assert (app/'Frameworks/CoreAIRecoveryRuntime.framework/CoreAIRecoveryRuntime').is_file()
          assert (app/'ThirdPartyNotices/llama.cpp.txt').is_file()
          notices=app/'Frameworks/CoreAIRecoveryRuntime.framework/ThirdPartyNotices/SOURCE-NOTICES.json'
          import json
          inventory=json.loads(notices.read_text());assert inventory['files'] and inventory['sourcePins']
          import hashlib
          for entry in inventory['files']:
              path=notices.parent/entry['path']
              assert path.resolve().is_relative_to(notices.parent.resolve()) and path.is_file()
              assert path.stat().st_size==entry['bytes'] and hashlib.sha256(path.read_bytes()).hexdigest()==entry['sha256']
          assert not (app/'embedded.mobileprovision').exists()
          PY
      - name: Prepare the unsigned QA IPA and compile receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/model-probe-package" "$RUNNER_TEMP/model-probe-package/Payload"
          /usr/bin/ditto "$RUNNER_TEMP/model-probe-build/Build/Products/Release-iphoneos/ModelProbe.app" "$RUNNER_TEMP/model-probe-package/Payload/ModelProbe.app"
          cd "$RUNNER_TEMP/model-probe-package"
          /usr/bin/ditto -c -k --keepParent Payload ios-model-probe.ipa
          python3 - ios-model-probe.ipa <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          ipa=pathlib.Path(sys.argv[1])
          notices=pathlib.Path(os.environ['RUNNER_TEMP'])/'model-probe-build/Build/Products/Release-iphoneos/ModelProbe.app/Frameworks/CoreAIRecoveryRuntime.framework/ThirdPartyNotices/SOURCE-NOTICES.json'
          receipt=dict(scope='Standalone fictional native probe; SDKcompile only, no physical inference/model quality qualification',bundleId='jp.n624.takupoke-modelprobe',minimumOS='27.0',ipaBytes=ipa.stat().st_size,ipaSHA256=hashlib.sha256(ipa.read_bytes()).hexdigest(),reviewedSourceSHA256=os.environ['QA_SOURCE_SHA256'],workflowCommit=os.environ['GITHUB_SHA'],runId=os.environ['GITHUB_RUN_ID'],xcode=subprocess.check_output(['xcodebuild','-version'],text=True),runtimeSourceNoticesSHA256=hashlib.sha256(notices.read_bytes()).hexdigest(),signing='Unsigned for local AltServer/AltStore research install; no distribution certificate or main-app version')
          pathlib.Path('ios-model-probe-compile.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Attach only to the existing draft research prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$QA_RELEASE_ID" > "$RUNNER_TEMP/qa-release-final.json"
          python3 - "$RUNNER_TEMP/qa-release-final.json" <<'PY'
          import json,os,sys
          value=json.load(open(sys.argv[1]));assert value['id']==int(os.environ['QA_RELEASE_ID']) and value['tag_name']==os.environ['QA_TAG'] and value['draft'] and value['prerelease']
          PY
          python3 "$RUNNER_TEMP/model-probe-input/ios-high-phone-benchmark/tools/upload_qa_artifacts.py" "$RUNNER_TEMP/model-probe-package"
      - name: Remove only this job's owned temporary directories
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/model-probe-input/ios-high-phone-benchmark/tools/upload_qa_artifacts.py"
          cleanup_status=0
          if [[ -f "$helper" && -f "$RUNNER_TEMP/model-probe-package/upload-owned-assets.json" ]]; then
            python3 "$helper" "$RUNNER_TEMP/model-probe-package" --cleanup || cleanup_status=$?
          fi
          rm -rf "$RUNNER_TEMP/model-probe-input" "$RUNNER_TEMP/model-probe-build" "$RUNNER_TEMP/model-probe-package" "$RUNNER_TEMP/model-probe-xcodebuild.log" "$RUNNER_TEMP/qa-release.json" "$RUNNER_TEMP/qa-release-final.json"
          exit "$cleanup_status"
