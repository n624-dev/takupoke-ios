name: Native application relaunch diagnosis

on:
  workflow_dispatch:
    inputs:
      case:
        type: choice
        default: all
        options:
          - all
          - retention
          - notifications
          - controls
          - rows
          - material-detail-navigation
          - rows-context
          - weekday-carryover
          - countdown-calendar
          - countdown-progress
          - countdown-notifications
          - countdown-school-notices
          - countdown-storage
          - countdown-delete
          - countdown-notification-route
          - countdown-and-yellow
          - yellow-contrast
          - countdown-notification-context
          - countdown
          - input-delivery
          - file-details
          - status-settings
          - status-settings-screen
          - updates
          - auxiliary-store
          - event-cache-input
          - timetable-clocks
          - week-change-details
          - merged-lesson-cards
          - system-text-size
          - home-boundaries
          - home-launch
          - testChangedAccountDataNoticeOpensSharedAcquisition
          - testChangedDataProducesOneLocalNotification
          - testHomeAndTimetableDetailsCloseForSavedUpdatesButRemainDuringBusyWork
          - testLinkPreferencesSurviveRelaunch
          - testNotificationControlsAndAppearance
          - testSettingsAccountDataAndFileDetails
      ios:
        description: Diagnose iOS 27 first; include 26 only for a confirmed comparison
        type: choice
        default: '27'
        options: ['27', '26', 'both']
      sdk27:
        description: Additional iOS 27 toolchain comparison; distribution stays unchanged
        type: choice
        default: '27.1'
        options:
          - '27.0'
          - '27.1'
          - '27.2'
      sdk26:
        description: Compare iOS 26.5 using the shipping SDK; distribution stays unchanged
        type: choice
        default: '26.6'
        options: ['26.6', '27.0', '27.1', '27.2']

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  focus:
    name: Relaunch diagnosis iOS ${{ matrix.ios }}${{ (inputs.case == 'status-settings' || inputs.case == 'material-detail-navigation') && format(' ({0})', matrix.probe_case) || '' }}
    strategy:
      fail-fast: false
      matrix:
        ios: ${{ fromJSON(inputs.ios == 'both' && '[27,26]' || inputs.ios == '26' && '[26]' || '[27]') }}
        # Keep the longer account/details and the new status screen in their own runner budgets.
        probe_case: ${{ fromJSON(inputs.case == 'status-settings' && '["testSettingsAccountDataAndFileDetails","status-settings-overviews","status-settings-screen"]' || inputs.case == 'material-detail-navigation' && '["failed-special-details","rows","countdown-calendar"]' || format('[{0}]', toJSON(inputs.case))) }}
    runs-on: ${{ matrix.ios == 26 && inputs.sdk26 == '26.6' && 'macos-26' || 'xcode-27' }}
    # The iOS 26 color case includes a simulator relaunch after installing the runtime.
    timeout-minutes: ${{ (matrix.probe_case == 'rows' || (matrix.ios == 26 && matrix.probe_case == 'yellow-contrast')) && 45 || 30 }}
    env:
      DEVELOPER_DIR: >-
        ${{ format('/Applications/Xcode_{0}.app/Contents/Developer', matrix.ios == 26 && inputs.sdk26 || inputs.sdk27) }}
      TKPK_EXPECTED_IOS_SDK: ${{ matrix.ios == 26 && inputs.sdk26 == '26.6' && '26.5' || matrix.ios == 26 && inputs.sdk26 || inputs.sdk27 }}
      TKPK_TEST_IOS: ${{ matrix.ios }}
      TKPK_UI_PROBE_SDK27: ${{ inputs.sdk27 }}
      TKPK_UI_PROBE_SDK26: ${{ inputs.sdk26 }}
      TKPK_UI_RELAUNCH_PROBE: '1'
      TKPK_SIMULATOR_FRONTEND: ${{ matrix.ios == 26 && 'gui' || 'headless' }}
      TKPK_UI_HANG_DIAGNOSTICS: ${{ (matrix.probe_case == 'rows' || matrix.probe_case == 'rows-context') && '1' || '0' }}
      TKPK_UI_PROBE_CASE: ${{ matrix.probe_case }}
      TKPK_RELAUNCH_RUNNER_SECONDS: ${{ (matrix.probe_case == 'rows' || (matrix.ios == 26 && matrix.probe_case == 'yellow-contrast')) && 2400 || 1440 }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require exact diagnostic source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Select the active Xcode for CLI and GUI services
        run: python3 -B tools/select-ci-xcode.py
      - name: Prepare shipping iOS 27.0 for the focused comparison
        if: matrix.ios == 27
        run: python3 -B tools/prepare-ios27-runtime.py
      - name: Require comparison toolchain and unchanged runtime
        run: |
          set -euo pipefail
          xcodebuild -version
          actual_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          printf 'Comparison simulator SDK: %s\n' "$actual_sdk"
          expected_sdk="$TKPK_UI_PROBE_SDK27"
          if [[ "$TKPK_TEST_IOS" == 26 ]]; then
            expected_sdk="$TKPK_UI_PROBE_SDK26"
            if [[ "$expected_sdk" == 26.6 ]]; then expected_sdk=26.5; fi
          fi
          case "$expected_sdk" in 26.5|27.0|27.1|27.2) ;; *) exit 2 ;; esac
          test "$actual_sdk" = "$expected_sdk"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "$expected_sdk"
          if [[ "$TKPK_TEST_IOS" == 26 && "$TKPK_UI_PROBE_SDK26" != 26.6 ]]; then
            python3 -B tools/prepare-ios26-runtime.py --hold-export
          fi
          if [[ "$TKPK_TEST_IOS" == 27 ]]; then
            xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["runtimes"]
          if not any(r.get("isAvailable") and r["version"] == "27.0"
                     and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
                     for r in runtimes):
              raise SystemExit("Comparison requires unchanged iOS 27.0 runtime")
          print("Comparison runtime: iOS 27.0")'
          fi
      - name: Verify a native failure screenshot on a disposable simulator
        run: |
          set -euo pipefail
          scratch="$(mktemp -d "$RUNNER_TEMP/takupoke-screen-proof.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          export TKPK_SIMULATOR_FRONTEND=gui
          observed_status=0
          python3 -B tools/timed_command.py --timeout 1440 --cleanup-grace 120 'Native screenshot failure proof' \
            bash tools/test-app-ui.sh 2>&1 | tee "$scratch/failure.log" || observed_status=$?
          test "$observed_status" = 1
          python3 -B - "$scratch/failure.log" <<'PY'
          import base64, hashlib, sys
          from pathlib import Path
          log = Path(sys.argv[1]).read_text()
          assert "Intentional failure for screenshot copy verification" in log
          rows = [line.split() for line in log.splitlines() if line.startswith("TAKUPOKE_UI_IMAGE ")]
          assert rows[0][:3] == ["TAKUPOKE_UI_IMAGE", "BEGIN", "simulator-failure"]
          assert rows[-1][:3] == ["TAKUPOKE_UI_IMAGE", "END", "simulator-failure"]
          assert int(rows[-1][3]) == len(rows) - 2
          for i, row in enumerate(rows[1:-1]):
              assert row[:4] == ["TAKUPOKE_UI_IMAGE", "DATA", "simulator-failure", str(i)]
          data = base64.b64decode("".join(row[4] for row in rows[1:-1]), validate=True)
          assert data.startswith(b"\x89PNG\r\n\x1a\n")
          assert len(data) == int(rows[0][4]) and hashlib.sha256(data).hexdigest() == rows[0][3]
          print(f"Verified one native failure PNG ({len(data)} bytes) from a failing XCTest.")
          PY
      - name: Remove the owned relaunch runner log
        if: always()
        run: python3 -B -c 'import os; from pathlib import Path; (Path(os.environ["RUNNER_TEMP"])/"takupoke-relaunch-runner-owned.log").unlink(missing_ok=True)'
      - name: Remove the owned iOS 26 runtime export after simulator cleanup
        if: always() && matrix.ios == 26
        run: python3 -B tools/prepare-ios26-runtime.py --cleanup-export
