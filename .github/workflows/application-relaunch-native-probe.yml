name: Native application relaunch diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focus:
    name: Relaunch diagnosis iOS ${{ matrix.ios }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: 26
            runner: macos-26
            developer: /Applications/Xcode_26.6.app/Contents/Developer
          - ios: 27
            runner: xcode-27
            developer: /Applications/Xcode_27.0.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ matrix.developer }}
      TKPK_TEST_IOS: ${{ matrix.ios }}
      TKPK_UI_RELAUNCH_PROBE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require exact diagnostic source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Exercise both physical relaunch cases without retry or adoption credit
        run: |
          set -euo pipefail
          bash tools/test-app-ui.sh 2>&1 | tee "$RUNNER_TEMP/takupoke-relaunch-runner-owned.log"
          python3 -B tools/ui_test_manifest.py --relaunch-probe --mode verify --ios "$TKPK_TEST_IOS" --runner-log --log "$RUNNER_TEMP/takupoke-relaunch-runner-owned.log"
      - name: Remove the owned relaunch runner log
        if: always()
        run: python3 -B -c 'import os; from pathlib import Path; (Path(os.environ["RUNNER_TEMP"])/"takupoke-relaunch-runner-owned.log").unlink(missing_ok=True)'
