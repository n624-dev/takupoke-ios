name: Native application relaunch diagnosis

on:
  workflow_dispatch:
    inputs:
      case:
        type: choice
        default: all
        options:
          - all
          - testChangedAccountDataNoticeOpensSharedAcquisition
          - testChangedDataProducesOneLocalNotification
          - testHomeAndTimetableDetailsCloseForSavedUpdatesButRemainDuringBusyWork
          - testLinkPreferencesSurviveRelaunch
          - testNotificationControlsAndAppearance
          - testSettingsAccountDataAndFileDetails
      settings_read:
        description: Compare actual OS settings API routes in the disposable test app
        type: choice
        default: async
        options: [async, callback]

permissions:
  contents: read

jobs:
  focus:
    name: Relaunch diagnosis iOS ${{ matrix.ios }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: 26
            runner: macos-26
            developer: /Applications/Xcode_26.6.app/Contents/Developer
          - ios: 27
            runner: xcode-27
            developer: /Applications/Xcode_27.0.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ matrix.developer }}
      TKPK_TEST_IOS: ${{ matrix.ios }}
      TKPK_UI_RELAUNCH_PROBE: '1'
      TKPK_UI_PROBE_CASE: ${{ inputs.case }}
      TKPK_NOTIFICATION_SETTINGS_READ: ${{ inputs.settings_read }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require exact diagnostic source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Exercise launch, native switches, permission, busy work and relaunch without retry or adoption credit
        run: |
          set -euo pipefail
          bash tools/test-app-ui.sh 2>&1 | tee "$RUNNER_TEMP/takupoke-relaunch-runner-owned.log"
          selection=(--relaunch-probe)
          if [[ "$TKPK_UI_PROBE_CASE" != all ]]; then
            selection+=(--probe-case "$TKPK_UI_PROBE_CASE")
          fi
          python3 -B tools/ui_test_manifest.py "${selection[@]}" --mode verify --ios "$TKPK_TEST_IOS" --runner-log --log "$RUNNER_TEMP/takupoke-relaunch-runner-owned.log"
      - name: Remove the owned relaunch runner log
        if: always()
        run: python3 -B -c 'import os; from pathlib import Path; (Path(os.environ["RUNNER_TEMP"])/"takupoke-relaunch-runner-owned.log").unlink(missing_ok=True)'
