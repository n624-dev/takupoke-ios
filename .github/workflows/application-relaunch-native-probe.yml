name: Native application relaunch diagnosis

on:
  push:
    branches: [codex/pdf-local-recovery]
    paths: [.github/workflows/application-relaunch-native-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focus:
    name: Relaunch diagnosis iOS ${{ matrix.ios }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: 26
            runner: macos-26
            developer: /Applications/Xcode_26.6.app/Contents/Developer
          - ios: 27
            runner: xcode-27
            developer: /Applications/Xcode_27.0.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ matrix.developer }}
      TKPK_TEST_IOS: ${{ matrix.ios }}
      TKPK_UI_RELAUNCH_PROBE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require exact diagnostic source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Exercise both physical relaunch cases without retry or adoption credit
        run: bash tools/test-app-ui.sh
