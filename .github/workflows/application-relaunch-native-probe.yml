name: Native application relaunch diagnosis

on:
  workflow_dispatch:
    inputs:
      case:
        type: choice
        default: all
        options:
          - all
          - retention
          - notifications
          - controls
          - rows
          - rows-context
          - input-delivery
          - file-details
          - updates
          - auxiliary-store
          - timetable-clocks
          - home-boundaries
          - home-launch
          - testChangedAccountDataNoticeOpensSharedAcquisition
          - testChangedDataProducesOneLocalNotification
          - testHomeAndTimetableDetailsCloseForSavedUpdatesButRemainDuringBusyWork
          - testLinkPreferencesSurviveRelaunch
          - testNotificationControlsAndAppearance
          - testSettingsAccountDataAndFileDetails
      ios:
        description: Diagnose iOS 27 first; include 26 only for a confirmed comparison
        type: choice
        default: '27'
        options: ['27', '26', 'both']
      sdk27:
        description: Additional iOS 27 toolchain comparison; distribution stays unchanged
        type: choice
        default: '27.1'
        options:
          - '27.0'
          - '27.1'
          - '27.2'
      sdk26:
        description: Compare iOS 26.5 using the shipping SDK; distribution stays unchanged
        type: choice
        default: '26.6'
        options: ['26.6', '27.0', '27.1', '27.2']

permissions:
  contents: read

jobs:
  focus:
    name: Relaunch diagnosis iOS ${{ matrix.ios }}
    strategy:
      fail-fast: false
      matrix:
        ios: ${{ fromJSON(inputs.ios == 'both' && '[27,26]' || inputs.ios == '26' && '[26]' || '[27]') }}
    runs-on: ${{ matrix.ios == 26 && inputs.sdk26 == '26.6' && 'macos-26' || 'xcode-27' }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: >-
        ${{ format('/Applications/Xcode_{0}.app/Contents/Developer', matrix.ios == 26 && inputs.sdk26 || inputs.sdk27) }}
      TKPK_EXPECTED_IOS_SDK: ${{ matrix.ios == 26 && inputs.sdk26 == '26.6' && '26.5' || matrix.ios == 26 && inputs.sdk26 || inputs.sdk27 }}
      TKPK_TEST_IOS: ${{ matrix.ios }}
      TKPK_UI_PROBE_SDK27: ${{ inputs.sdk27 }}
      TKPK_UI_PROBE_SDK26: ${{ inputs.sdk26 }}
      TKPK_UI_RELAUNCH_PROBE: '1'
      TKPK_UI_HANG_DIAGNOSTICS: ${{ inputs.case == 'rows-context' && '1' || '0' }}
      TKPK_UI_PROBE_CASE: ${{ inputs.case }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require exact diagnostic source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare shipping iOS 27.0 for the focused comparison
        if: matrix.ios == 27
        run: python3 -B tools/prepare-ios27-runtime.py
      - name: Require comparison toolchain and unchanged runtime
        run: |
          set -euo pipefail
          xcodebuild -version
          actual_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          printf 'Comparison simulator SDK: %s\n' "$actual_sdk"
          expected_sdk="$TKPK_UI_PROBE_SDK27"
          if [[ "$TKPK_TEST_IOS" == 26 ]]; then
            expected_sdk="$TKPK_UI_PROBE_SDK26"
            if [[ "$expected_sdk" == 26.6 ]]; then expected_sdk=26.5; fi
          fi
          case "$expected_sdk" in 26.5|27.0|27.1|27.2) ;; *) exit 2 ;; esac
          test "$actual_sdk" = "$expected_sdk"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "$expected_sdk"
          if [[ "$TKPK_TEST_IOS" == 26 && "$TKPK_UI_PROBE_SDK26" != 26.6 ]]; then
            python3 -B tools/prepare-ios26-runtime.py
          fi
          if [[ "$TKPK_TEST_IOS" == 27 ]]; then
            xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["runtimes"]
          if not any(r.get("isAvailable") and r["version"] == "27.0"
                     and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
                     for r in runtimes):
              raise SystemExit("Comparison requires unchanged iOS 27.0 runtime")
          print("Comparison runtime: iOS 27.0")'
          fi
      - name: Exercise launch, native switches, permission, busy work and relaunch without retry or adoption credit
        run: |
          set -euo pipefail
          bash tools/test-app-ui.sh 2>&1 | tee "$RUNNER_TEMP/takupoke-relaunch-runner-owned.log"
          selection=(--relaunch-probe)
          if [[ "$TKPK_UI_PROBE_CASE" != all ]]; then
            selection+=(--probe-case "$TKPK_UI_PROBE_CASE")
          fi
          python3 -B tools/ui_test_manifest.py "${selection[@]}" --mode verify --ios "$TKPK_TEST_IOS" --runner-log --log "$RUNNER_TEMP/takupoke-relaunch-runner-owned.log"
      - name: Remove the owned relaunch runner log
        if: always()
        run: python3 -B -c 'import os; from pathlib import Path; (Path(os.environ["RUNNER_TEMP"])/"takupoke-relaunch-runner-owned.log").unlink(missing_ok=True)'
